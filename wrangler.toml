name = "node-observatory"
main = "src/index.js"
compatibility_date = "2026-10-10"

[triggers]
crons = ["0 0,12 * * *"]

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "node-observatory"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# 网站密码登录会话 + 登录失败限流。创建 KV namespace 后替换 id。
[[kv_namespaces]]
binding = "KV"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

# 密钥用 `wrangler secret put` 或 Dashboard Secrets 设置，不要写进本文件：
#   wrangler secret put SUBSCRIPTION_KEY
#   wrangler secret put ADMIN_TOKEN
#   wrangler secret put ADMIN_PASSWORD
#   wrangler secret put GITHUB_TOKEN
#
# 可选普通变量：
# [vars]
# PUBLIC_BASE_URL = "https://nodes.example.com"
# MAX_REPOS = "60"
# SUBREQUEST_BUDGET = "900"
# RISK_MAX_AGE_DAYS = "7"
